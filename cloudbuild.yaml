# Cloud Build configuration for LeadFlow Pro.
#
# Builds the container with the Pipedrive custom-field VITE_* build args
# baked into the frontend bundle. The n8n URL is NOT a build arg — the
# server proxies /api/n8n/* to the real n8n host using the runtime env
# var N8N_BASE_URL configured on Cloud Run.
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REPO=leadflow,_REGION=europe-west1,\
# _PIPEDRIVE_PERSON_LINKEDIN_KEY=...,_PIPEDRIVE_PERSON_HEADLINE_KEY=...,\
# _PIPEDRIVE_ORG_APOLLO_ID_KEY=...,_PIPEDRIVE_ORG_COMPANY_DESCRIPTION_KEY=...

substitutions:
  _REGION: europe-west1
  _REPO: leadflow
  _IMAGE: app
  # Image tag for the build-specific copy. Defaults to "manual" for
  # ad-hoc gcloud builds submit; pass _SHA=$(git rev-parse --short HEAD)
  # to use the actual commit SHA.
  _SHA: manual
  _PIPEDRIVE_PERSON_LINKEDIN_KEY: ''
  _PIPEDRIVE_PERSON_HEADLINE_KEY: ''
  _PIPEDRIVE_ORG_APOLLO_ID_KEY: ''
  _PIPEDRIVE_ORG_COMPANY_DESCRIPTION_KEY: ''

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
      - --build-arg=VITE_PIPEDRIVE_PERSON_LINKEDIN_KEY=${_PIPEDRIVE_PERSON_LINKEDIN_KEY}
      - --build-arg=VITE_PIPEDRIVE_PERSON_HEADLINE_KEY=${_PIPEDRIVE_PERSON_HEADLINE_KEY}
      - --build-arg=VITE_PIPEDRIVE_ORG_APOLLO_ID_KEY=${_PIPEDRIVE_ORG_APOLLO_ID_KEY}
      - --build-arg=VITE_PIPEDRIVE_ORG_COMPANY_DESCRIPTION_KEY=${_PIPEDRIVE_ORG_COMPANY_DESCRIPTION_KEY}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
